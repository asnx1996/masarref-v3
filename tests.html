<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبارات مصاريفنا 🧪</title>
<style>
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#FBF7F1;color:#2A2018;max-width:720px;margin:0 auto;padding:20px}
  h1{font-size:1.3rem}
  .sum{padding:12px 16px;border-radius:12px;font-weight:700;margin:12px 0}
  .sum.ok{background:#E1F1EA;color:#26765A}
  .sum.bad{background:#F8E6E3;color:#A33530}
  .t{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-bottom:1px solid #EBE2D6;font-size:.9rem}
  .t.pass::before{content:'✓';color:#3F9E7A;font-weight:800}
  .t.fail::before{content:'✕';color:#C0453E;font-weight:800}
  .t.fail{background:#FDF2F0}
  .t small{color:#93887C;display:block}
  code{background:#F1E9DD;padding:1px 5px;border-radius:6px;font-size:.8rem;direction:ltr;display:inline-block}
</style>
</head>
<body>
<h1>🧪 اختبارات الدوال الحسابية (core.js)</h1>
<div id="summary" class="sum">جاري التشغيل...</div>
<div id="results"></div>

<script src="core.js"></script>
<script>
/* عدّاء اختبارات مصغّر — بلا أي مكتبات */
const results = [];
function test(name, fn){
  try{ fn(); results.push({ name, ok:true }); }
  catch(e){ results.push({ name, ok:false, err: e.message }); }
}
function eq(actual, expected, label){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if(a !== b) throw new Error((label ? label + ' — ' : '') + 'توقعنا ' + b + ' وطلع ' + a);
}

/* ---------- num: تنظيف المدخلات الرقمية ---------- */
test('num: يشيل الفواصل ويرجّع رقم', () => eq(num('12,500'), 12500));
test('num: نص مو رقم يرجّع صفر', () => eq(num('abc'), 0));
test('num: فارغ يرجّع صفر', () => eq(num(''), 0));
test('num: يقبل الفارزة العشرية', () => eq(num('1.5'), 1.5));

/* ---------- fmt: تنسيق العملة ---------- */
test('fmt: دينار عراقي بعد الرقم', () => { CURRENCY = 'iqd'; eq(fmt(1250000), '1,250,000 د.ع'); });
test('fmt: دولار قبل الرقم', () => { CURRENCY = 'usd'; eq(fmt(1000), '$1,000'); CURRENCY = 'iqd'; });
test('fmt: قيمة خربانة تصير صفر', () => eq(fmt('خربان'), '0 د.ع'));

/* ---------- esc: الحماية من حقن HTML ---------- */
test('esc: يهرّب كل الرموز الخطرة', () =>
  eq(esc('<a "b" \'c\' &>'), '&lt;a &quot;b&quot; &#39;c&#39; &amp;&gt;'));
test('esc: نص عربي عادي يمر مثل ما هو', () => eq(esc('كهرباء وماء'), 'كهرباء وماء'));

/* ---------- التاريخ المحلي (إصلاح مشكلة UTC) ---------- */
test('localISO: تنسيق صحيح مع أصفار', () => eq(localISO(new Date(2026, 0, 5)), '2026-01-05'));
test('localISO: نص الليل بأول الشهر يظل بنفس اليوم المحلي', () =>
  eq(localISO(new Date(2026, 6, 1, 0, 30)), '2026-07-01'));   // بـUTC چان طلع 2026-06-30
test('todayISO: صيغة YYYY-MM-DD', () => { if(!/^\d{4}-\d{2}-\d{2}$/.test(todayISO())) throw new Error(todayISO()); });
test('thisMonth: صيغة YYYY-MM', () => { if(!/^\d{4}-\d{2}$/.test(thisMonth())) throw new Error(thisMonth()); });

/* ---------- الشهر السابق/الجاي وأيام الشهر ---------- */
test('prevMonthStr: يرجع لشهر ١٢ بالسنة السابقة', () => eq(prevMonthStr('2026-01'), '2025-12'));
test('prevMonthStr: شهر عادي', () => eq(prevMonthStr('2026-07'), '2026-06'));
test('nextMonthStr: شهر عادي', () => eq(nextMonthStr('2026-07'), '2026-08'));
test('nextMonthStr: من ١٢ ينط للسنة الجاية', () => eq(nextMonthStr('2026-12'), '2027-01'));
test('nextMonthStr: عكس prevMonthStr', () => eq(nextMonthStr(prevMonthStr('2026-07')), '2026-07'));

/* ---------- dateInMonth: تاريخ جوّا الشهر المعروض (لإرجاع القرض) ---------- */
test('dateInMonth: الشهر الحالي يرجّع اليوم', () => eq(dateInMonth(thisMonth()), todayISO()));
test('dateInMonth: شهر جاي يرجّع أول يوم', () => eq(dateInMonth(nextMonthStr(thisMonth())), nextMonthStr(thisMonth()) + '-01'));
test('dateInMonth: شهر فات يرجّع آخر يوم', () => {
  const pm = prevMonthStr(thisMonth());
  eq(dateInMonth(pm), pm + '-' + ('0'+daysInMonth(pm)).slice(-2));
});
test('daysInMonth: شباط عادي ٢٨', () => eq(daysInMonth('2026-02'), 28));
test('daysInMonth: شباط كبيسة ٢٩', () => eq(daysInMonth('2024-02'), 29));
test('daysInMonth: كانون الثاني ٣١', () => eq(daysInMonth('2026-01'), 31));

/* ---------- monthProgress ---------- */
test('monthProgress: شهر ماضي كله منقضي', () => eq(monthProgress('2000-01'), { elapsed:31, left:0, total:31 }));
test('monthProgress: شهر جاي كله باقي', () => eq(monthProgress('2099-01'), { elapsed:0, left:31, total:31 }));
test('monthProgress: الشهر الحالي منقضي = يوم اليوم', () => {
  const p = monthProgress(thisMonth());
  eq(p.elapsed, new Date().getDate(), 'elapsed');
  eq(p.left, p.total - p.elapsed, 'left');
});

/* ---------- الفترات: اسم + بداية/نهاية حرة ---------- */
test('addDays: يعبر نهاية الشهر', () => eq(addDays('2026-07-30', 5), '2026-08-04'));
test('addDays: يعبر نهاية السنة', () => eq(addDays('2026-12-31', 1), '2027-01-01'));
test('addDays: بالسالب يرجع للورا', () => eq(addDays('2026-08-01', -1), '2026-07-31'));
test('daysBetween: نفس اليوم = ١', () => eq(daysBetween('2026-07-20','2026-07-20'), 1));
test('daysBetween: فترة ٢٠ تموز ← ١٨ آب = ٣٠ يوم', () => eq(daysBetween('2026-07-20','2026-08-18'), 30));
test('daysBetween: عكس addDays للمدة الافتراضية', () =>
  eq(daysBetween('2026-07-20', addDays('2026-07-20', PERIOD_DAYS - 1)), PERIOD_DAYS));

test('hasPeriodDates: يحتاج التاريخين سوا', () => {
  eq(hasPeriodDates({ startDate:'2026-07-20', endDate:'2026-08-18' }), true, 'الاثنين');
  eq(hasPeriodDates({ startDate:'2026-07-20' }), false, 'بداية بس');
  eq(hasPeriodDates(null), false, 'فاضي');
});
test('periodLabel: الاسم إذا موجود وإلا «شهر MM»', () => {
  eq(periodLabel({ title:'مصاريف شهر ٨' }, '2026-08'), 'مصاريف شهر ٨', 'بيه اسم');
  eq(periodLabel({}, '2026-08'), 'شهر 2026-08', 'بلا اسم');
});
test('suggestPeriodTitle: يزيد الرقم العربي', () => eq(suggestPeriodTitle('مصاريف شهر ٧', '2026-08'), 'مصاريف شهر ٨'));
test('suggestPeriodTitle: يزيد الرقم الإنكليزي', () => eq(suggestPeriodTitle('Month 7', '2026-08'), 'Month 8'));
test('suggestPeriodTitle: ٩ ← ١٠', () => eq(suggestPeriodTitle('شهر ٩', '2026-10'), 'شهر ١٠'));
test('suggestPeriodTitle: بلا اسم سابق يبني من المفتاح', () => eq(suggestPeriodTitle('', '2026-08'), 'مصاريف شهر ٨'));

test('monthProgress: بلا تواريخ يظل يشتغل بالشهر التقويمي', () =>
  eq(monthProgress('2000-01', {}), { elapsed:31, left:0, total:31 }));
test('monthProgress: فترة كاملة بالماضي', () =>
  eq(monthProgress('2026-07', { startDate:'2000-07-20', endDate:'2000-08-18' }), { elapsed:30, left:0, total:30 }));
test('monthProgress: فترة كلها بالمستقبل', () =>
  eq(monthProgress('2099-01', { startDate:'2099-01-01', endDate:'2099-01-30' }), { elapsed:0, left:30, total:30 }));
test('monthProgress: فترة شغّالة هسه — اليوم الأول', () => {
  const p = monthProgress('2026-08', { startDate: todayISO(), endDate: addDays(todayISO(), 29) });
  eq(p.total, 30, 'total');
  eq(p.elapsed, 1, 'elapsed');
  eq(p.left, 29, 'left');
});

test('periodDefaultDate: اليوم إذا داخل الفترة', () =>
  eq(periodDefaultDate({ startDate: addDays(todayISO(), -3), endDate: addDays(todayISO(), 10) }, '2026-08'), todayISO()));
test('periodDefaultDate: قبل البداية ينط للبداية', () => {
  const s = addDays(todayISO(), 5);
  eq(periodDefaultDate({ startDate:s, endDate: addDays(s, 29) }, '2026-08'), s);
});
test('periodDefaultDate: بعد النهاية ينط للنهاية', () => {
  const e = addDays(todayISO(), -2);
  eq(periodDefaultDate({ startDate: addDays(e, -29), endDate:e }, '2026-07'), e);
});
test('periodDefaultDate: بلا تواريخ يرجع لـdateInMonth', () =>
  eq(periodDefaultDate({}, thisMonth()), dateInMonth(thisMonth())));

/* ---------- طابور الأوفلاين ---------- */
test('طابور الأوفلاين: إضافة وحذف', () => {
  const bak = localStorage.getItem(OFFLINE_KEY);   // نحفظ الطابور الحقيقي وما نخربه
  try{
    localStorage.removeItem(OFFLINE_KEY);
    eq(offlineList(), [], 'يبدي فارغ');
    const q1 = offlineAdd({ month:'2026-07', date:'2026-07-22', amount:5000, desc:'تجربة ١', category:'بقالة' });
    const q2 = offlineAdd({ month:'2026-07', date:'2026-07-22', amount:9000, desc:'تجربة ٢', category:'' });
    eq(offlineList().length, 2, 'صار بيه اثنين');
    if(q1 === q2) throw new Error('المعرّفات لازم تكون مختلفة');
    offlineRemove(q1);
    eq(offlineList().length, 1, 'ضل واحد');
    eq(offlineList()[0].desc, 'تجربة ٢', 'الباقي هو الثاني');
    offlineRemove(q2);
    eq(offlineList(), [], 'رجع فارغ');
  }finally{
    if(bak === null) localStorage.removeItem(OFFLINE_KEY); else localStorage.setItem(OFFLINE_KEY, bak);
  }
});
test('طابور الأوفلاين: بيانات خربانة بالتخزين ما تكسره', () => {
  const bak = localStorage.getItem(OFFLINE_KEY);
  try{
    localStorage.setItem(OFFLINE_KEY, '{خربان json');
    eq(offlineList(), []);
  }finally{
    if(bak === null) localStorage.removeItem(OFFLINE_KEY); else localStorage.setItem(OFFLINE_KEY, bak);
  }
});

/* ---------- استحقاق الفواتير المتكررة ---------- */
test('billDueISO: يوم عادي يمر مثل ما هو', () => eq(billDueISO('2026-08', 10), '2026-08-10'));
test('billDueISO: يوم واحد خانة ينزاد له صفر', () => eq(billDueISO('2026-08', 5), '2026-08-05'));
test('billDueISO: ٣١ بشباط ينقصّ لآخر يوم', () => eq(billDueISO('2026-02', 31), '2026-02-28'));
test('billDueISO: ٣١ بشهر ٣٠ يوم ينقصّ', () => eq(billDueISO('2026-04', 31), '2026-04-30'));
test('billDueISO: شباط الكبيسة ٢٩ يوم', () => eq(billDueISO('2028-02', 31), '2028-02-29'));
test('billDueISO: يوم صفر أو فاضي يصير ١', () => { eq(billDueISO('2026-08', 0), '2026-08-01'); eq(billDueISO('2026-08', null), '2026-08-01'); });
test('billDueISO: النتيجة دايماً تاريخ صالح', () => {
  for(const m of ['2026-01','2026-02','2026-04','2026-12']){
    for(const d of [1, 15, 28, 29, 30, 31]){
      const iso = billDueISO(m, d);
      if(isNaN(new Date(iso).getTime())) throw new Error('تاريخ غير صالح: ' + iso);
    }
  }
});

/* ---------- أنواع الحركات (القرض المحمّل) ---------- */
const FUNDS = new Set(['قاصة','ادخار البطاقة']);
const ex = (o) => Object.assign({ amount:0, desc:'', category:'أكل' }, o);

test('kindOf: العمود الصريح من السيرفر يفوز', () =>
  eq(kindOf(ex({ kind:'cat_loan', amount:100, desc:'أي شي' }), FUNDS), 'cat_loan'));
test('kindOf: مصروف عادي', () => eq(kindOf(ex({ amount:5000, desc:'خبز' }), FUNDS), 'spend'));
test('kindOf: سحب من صندوق', () =>
  eq(kindOf(ex({ amount:5000, desc:'سحب: تصليح', category:'قاصة' }), FUNDS), 'fund_wd'));
test('kindOf: قرض من صندوق', () =>
  eq(kindOf(ex({ amount:5000, desc:'قرض لتصنيف «أكل»', category:'قاصة' }), FUNDS), 'fund_loan'));
test('kindOf: إيداع من الفائض', () =>
  eq(kindOf(ex({ amount:-5000, desc:'إيداع: إضافة للرصيد', category:'قاصة' }), FUNDS), 'fund_dep'));
test('kindOf: إيداع من تصنيف (مو من الفائض)', () =>
  eq(kindOf(ex({ amount:-5000, desc:'إيداع من «أكل»', category:'قاصة' }), FUNDS), 'fund_dep_cat'));
test('kindOf: إرجاع دين للصندوق', () =>
  eq(kindOf(ex({ amount:-5000, desc:'إرجاع دين: أخوي', category:'قاصة' }), FUNDS), 'fund_ret'));
test('kindOf: تمويل تصنيف من سحب', () =>
  eq(kindOf(ex({ amount:-5000, desc:'تمويل من صندوق «قاصة»' }), FUNDS), 'cat_fund'));
test('kindOf: تمويل تصنيف من قرض قديم (v1)', () =>
  eq(kindOf(ex({ amount:-5000, desc:'قرض من صندوق «قاصة»' }), FUNDS), 'cat_loan_v1'));
test('kindOf: سداد قرض قديم (v1)', () =>
  eq(kindOf(ex({ amount:5000, desc:'سداد قرض لصندوق «قاصة»' }), FUNDS), 'cat_pay_v1'));
test('kindOf: وصف يبدي بنفس كلمات القرض ما يخرّب المصروف', () => {
  /* المستخدم يكتب «قرض من صندوق الخير» كتفاصيل مصروف عادي (موجب) —
     لازم يظل مصروف، مو حركة صندوق */
  eq(kindOf(ex({ amount:5000, desc:'قرض من صندوق «قاصة»' }), FUNDS), 'spend');
});

test('hitsRemain: القرض المحمّل ما يمسّ الباقي للصرف', () => eq(hitsRemain('cat_loan'), false));
test('hitsRemain: تصحيح/إعدام القرض ما يمسّ الباقي', () => eq(hitsRemain('cat_fix'), false));
test('hitsRemain: تسديد القرض ينقص الباقي', () => eq(hitsRemain('cat_pay'), true));
test('hitsRemain: المصروف العادي ينقص الباقي', () => eq(hitsRemain('spend'), true));
test('hitsRemain: حركات الصناديق مطلوعة (إلها حسابها)', () => eq(hitsRemain('fund_wd'), false));
test('hitsCat: التسديد ما ينخصم من التصنيف مرة ثانية', () => eq(hitsCat('cat_pay'), false));
test('hitsCat: القرض المحمّل ينخصم من التصنيف', () => eq(hitsCat('cat_loan'), true));
test('hitsCat: التصحيح يرجّع للتصنيف', () => eq(hitsCat('cat_fix'), true));
test('كل نوع يمسّ الباقي أو التصنيف — مو الاثنين بالقروض الجديدة', () => {
  for(const k of ['cat_loan','cat_pay','cat_fix']){
    if(hitsRemain(k) && hitsCat(k)) throw new Error(k + ' يمسّ الاثنين — ازدواج خصم');
  }
});
test('السلوك القديم (v1) ما انتغيّر: يمسّ الاثنين', () => {
  for(const k of ['spend','cat_fund','cat_loan_v1','cat_pay_v1','cat_dep']){
    if(!(hitsRemain(k) && hitsCat(k))) throw new Error(k + ' انتغيّر سلوكه');
  }
});
test('isFundMoveKind: المصروف العادي بس يبقى بسجل المصاريف', () => {
  eq(isFundMoveKind('spend'), false);
  for(const k of ['fund_wd','fund_dep','cat_fund','cat_loan','cat_pay','cat_fix']) eq(isFundMoveKind(k), true, k);
});

/* سيناريو كامل: قرض ١٠٠ من صندوق على تصنيف، ثم كل طريقة إغلاق */
function scenario(rows){
  let remain = 0, cat = 0, fund = 0;
  rows.forEach(r => {
    const k = r.kind;
    if(isFundKind(k)){ fund -= r.amount; return; }   // موجب على الصندوق = ينقص رصيده
    if(hitsCat(k))    cat    -= r.amount;            // موجب = ينقص المتاح
    if(hitsRemain(k)) remain -= r.amount;
  });
  return { remain, cat, fund };
}
test('سيناريو: قرض ١٠٠ ينقص الصندوق والتصنيف ولا يمسّ الباقي', () =>
  eq(scenario([
    { kind:'fund_loan', amount:100 },
    { kind:'cat_loan',  amount:100 }
  ]), { remain:0, cat:-100, fund:-100 }));
test('سيناريو: إرجاع — الصندوق يسترجع والتصنيف يبقى سالب', () =>
  eq(scenario([
    { kind:'fund_loan', amount:100 }, { kind:'cat_loan', amount:100 },
    { kind:'fund_ret',  amount:-100 }, { kind:'cat_pay', amount:100 }
  ]), { remain:-100, cat:-100, fund:0 }));
test('سيناريو: إرجاع كامل — كلشي يرجع لحالته والكلفة على الباقي', () =>
  eq(scenario([
    { kind:'fund_loan', amount:100 }, { kind:'cat_loan', amount:100 },
    { kind:'fund_ret',  amount:-100 }, { kind:'cat_pay', amount:100 },
    { kind:'cat_fix',   amount:-100 }
  ]), { remain:-100, cat:0, fund:0 }));
test('سيناريو: إعدام — الصندوق يخسر والتصنيف يرجع موجب', () =>
  eq(scenario([
    { kind:'fund_loan', amount:100 }, { kind:'cat_loan', amount:100 },
    { kind:'cat_fix',   amount:-100 }
  ]), { remain:0, cat:0, fund:-100 }));
test('سيناريو: بكل الطرق مجموع (الباقي + الصناديق) ينزل بالمصروف الفعلي بس', () => {
  const loan = [{ kind:'fund_loan', amount:100 }, { kind:'cat_loan', amount:100 }];
  const all = {
    'إرجاع': loan.concat([{ kind:'fund_ret', amount:-100 }, { kind:'cat_pay', amount:100 }]),
    'كامل':  loan.concat([{ kind:'fund_ret', amount:-100 }, { kind:'cat_pay', amount:100 }, { kind:'cat_fix', amount:-100 }]),
    'إعدام': loan.concat([{ kind:'cat_fix', amount:-100 }])
  };
  for(const nm in all){
    const s = scenario(all[nm]);
    if(s.remain + s.fund !== -100) throw new Error(nm + ': المجموع ' + (s.remain + s.fund) + ' والمفروض −100');
  }
});

/* ---------- التخزين المحلي المغلّف ---------- */
test('LS: قراءة مفتاح ماكو ترجّع null', () => eq(LS.get('mas_key_ma_mawjood_abadan'), null));
test('LS: قراءة مفتاح ماكو ترجّع القيمة الافتراضية', () => eq(LS.get('mas_key_ma_mawjood_abadan', 'x'), 'x'));
test('LS: كتابة وقراءة', () => { LS.set('mas_test_k', 'v1'); eq(LS.get('mas_test_k'), 'v1'); localStorage.removeItem('mas_test_k'); });
test('LS: الرقم ينخزن كنص', () => { LS.set('mas_test_k', 7); eq(LS.get('mas_test_k'), '7'); localStorage.removeItem('mas_test_k'); });

/* ---------- تمييز خطأ النت عن رفض السيرفر ---------- */
if(navigator.onLine){
  test('isNetErr: فشل الاتصال يعتبر خطأ نت', () => eq(isNetErr('TypeError: Failed to fetch'), true));
  test('isNetErr: رفض السيرفر (شهر مقفل) مو خطأ نت', () => eq(isNetErr('هذا الشهر مقفل'), false));
}

/* ---------- عرض النتائج ---------- */
const failed = results.filter(r => !r.ok);
document.getElementById('summary').className = 'sum ' + (failed.length ? 'bad' : 'ok');
document.getElementById('summary').textContent = failed.length
  ? '✕ فشل ' + failed.length + ' من أصل ' + results.length + ' اختبار'
  : '✓ نجحت كل الاختبارات (' + results.length + ')';
document.getElementById('results').innerHTML = results.map(r =>
  '<div class="t ' + (r.ok ? 'pass' : 'fail') + '"><div>' + r.name +
  (r.ok ? '' : '<small>' + r.err.replace(/</g,'&lt;') + '</small>') + '</div></div>'
).join('');
</script>
</body>
</html>
